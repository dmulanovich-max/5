</style></head><body><header><h1>5</h1><nav><button id="tH" class="active">Hoy</button><button id="tC">Calendario</button><button id="tS">Sueños</button><button id="tD">Datos</button></nav></header><main><section id="H"><div class="card"><b>Fecha</b><div style="height:8px"></div><input id="fecha" type="date"></div><div class="block"><div class="head" style="background:var(--a)">Gracias</div><div id="A" class="body five"></div></div><div class="block"><div class="head" style="background:var(--d)">Deseos</div><div id="W" class="body five"></div></div><div class="block"><div class="head" style="background:var(--p)">Artes</div><div id="P" class="body five"></div></div><div class="block"><div class="head" style="background:var(--o)">Sombras</div><div class="body"><input id="O" type="text"></div></div><div class="block"><div class="head" style="background:var(--r)">Ombligo</div><div class="body"><textarea id="R"></textarea></div></div><button id="save" class="save">Guardar día</button><div id="status" class="status"></div></section><section id="C" class="hidden"><div class="card"><div class="calhead"><button id="prev" class="secondary" style="width:auto">←</button><strong id="month"></strong><button id="next" class="secondary" style="width:auto">→</button></div><div id="cal" class="calendar"><div class="dow">L</div><div class="dow">M</div><div class="dow">X</div><div class="dow">J</div><div class="dow">V</div><div class="dow">S</div><div class="dow">D</div></div><div class="legend"><span><i class="dot blue"></i>5 + 5 + 5 completos</span><span><i class="dot green"></i>Ombligo</span><span><i class="dot brown"></i>Sombras</span></div></div><div id="detail" class="card detail hidden"></div></section><section id="S" class="hidden"><div class="card"><div class="dreamtop"><h2>Sueños</h2><button id="newDream" class="newdream">Nuevo</button></div><div id="dreams"></div></div></section><section id="D" class="hidden"><div class="card"><b>Datos</b><p class="small">Exporta todos tus r const K="cinco_diario_v1",$=x=>document.getElementById(x),COL={a:"var(--a)",w:"var(--d)",p:"var(--p)",o:"var(--o)",r:"var(--r)"};function mk(id,p){for(let i=1;i<=5;i++)$(id).insertAdjacentHTML("beforeend",`<div class=line><b class=num>${i}.</b><input id=${p}${i} type=text></div>`)}mk("A","a");mk("W","w");mk("P","p");function today(){let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)}function db(){try{return JSON.parse(localStorage.getItem(K)||"{}")}catch{return {}}}function st(x){localStorage.setItem(K,JSON.stringify(x))}function arr(p){return[1,2,3,4,5].map(i=>$(p+i).value.trim())}function set(p,a=[]){[1,2,3,4,5].forEach((i,j)=>$(p+i).value=a[j]||"")}function clear(){set("a");set("w");set("p");$("O").value="";$("R").value=""}function load(f){clear();$("fecha").value=f;let x=db()[f];if(!x)return;set("a",x.a);set("w",x.w);set("p",x.p);$("O").value=x.o||"";$("R").value=x.r||""}function form(){return{fecha:$("fecha").value,a:arr("a"),w:arr("w"),p:arr("p"),o:$("O").value.trim(),r:$("R").value.trim()}}function save(){let x=form(),d=db();d[x.fecha]=x;st(d);$("status").textContent="Guardado ✓";setTimeout(()=>$("status").textContent="",1500)}function complete(x){return["a","w","p"].every(k=>(x[k]||[]).length===5&&x[k].every(v=>v.trim()))}function show(v){["H","C","S","D"].forEach(x=>$(x).classList.toggle("hidden",x!==v));[["tH","H"],["tC","C"],["tS","S"],["tD","D"]].forEach(([b,x])=>$(b).classList.toggle("active",x===v));if(v==="C")render();if(v==="S")renderDreams();if(v==="D")listing()}let cd=new Date();function render(){let y=cd.getFullYear(),m=cd.getMonth(),d=db(),c=$("cal");$("month").textContent=cd.toLocaleDateString("es-ES",{month:"long",year:"numeric"});[...c.querySelectorAll(".day")].forEach(e=>e.remove());let first=(new Date(y,m,1).getDay()+6)%7,nmax=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){let e=document.createElement("div");e.className="day empty";c.appendChild(e)}for(let n=1;n<=nmax;n++){let f=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,x=d[f],dots="";if(x){if(complete(x))dots+='<i class="dot blue"></i>';if(x.r)dots+='<i class="dot green"></i>';if(x.o)dots+='<i class="dot brown"></i>'}let e=document.createElement("button");e.className="day";e.innerHTML=`<b>${n}</b><div class=dots>${dots}</div>`;e.onclick=()=>detail(f);c.appendChild(e)}}function section(t,col,a){let h=`<div class=section><div class=shead style="background:${col}">${t}</div>`;a.filter(Boolean).forEach(v=>h+=`<div class=srow>${v}</div>`);return h+"</div>"}function detail(f){let x=db()[f],d=$("detail");if(!x){d.classList.add("hidden");return}let dt=new Date(f+"T12:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),h=`<h2>${dt}</h2><button id=edit class=secondary>Editar día</button>`;h+=section("Gracias",COL.a,x.a||[])+section("Deseos",COL.w,x.w||[])+section("Artes",COL.p,x.p||[]);if(x.o)h+=section("Sombras",COL.o,[x.o]);if(x.r)h+=section("Ombligo",COL.r,[x.r]);d.innerHTML=h;d.classList.remove("hidden");$("edit").onclick=()=>{load(f);show("H")};d.scrollIntoView({behavior:"smooth",block:"start"})}function listing(){let a=Object.values(db()).sort((x,y)=>y.fecha.localeCompare(x.fecha));$("list").innerHTML=a.length?a.map(x=>`<div class=entry><b>${x.fecha}</b><div class=small>${complete(x)?"5 + 5 + 5 completo":"Registro parcial"}${x.r?" · Ombligo":""}${x.o?" · Sombras":""}</div></div>`).join(""):'<p class=small>Todavía no hay registros.</p>'}function esc(v){return '"'+String(v??"").replaceAll('"','""')+'"'}function exp(){let h=["fecha",...[1,2,3,4,5].map(i=>"gracias_"+i),...[1,2,3,4,5].map(i=>"deseo_"+i),...[1,2,3,4,5].map(i=>"arte_"+i),"sombras","ombligo"],rows=[h.map(esc).join(",")];Object.values(db()).sort((x,y)=>x.fecha.localeCompare(y.fecha)).forEach(x=>rows.push([x.fecha,...x.a,...x.w,...x.p,x.o,x.r].map(esc).join(",")));let b=new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createOb
